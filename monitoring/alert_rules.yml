groups:
  - name: nexusops.application
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate ({{ $value | humanizePercentage }})"
          description: "More than 5% of requests are returning 5xx errors over the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency ({{ $value }}s)"
          description: "95th percentile request latency exceeds 2 seconds."

      - alert: AppDown
        expr: up{job="nexusops"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NexusOps application is down"
          description: "The nexusops service has been unreachable for more than 1 minute."

      - alert: ChatPipelineErrors
        expr: rate(chat_pipeline_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Chat pipeline error rate elevated"
          description: "Chat pipeline is producing errors at {{ $value }} errors/s."

  - name: nexusops.infrastructure
    interval: 30s
    rules:
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Cannot scrape PostgreSQL metrics — database may be down."

      - alert: PostgresConnectionsHigh
        expr: pg_stat_activity_count > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection count ({{ $value }})"
          description: "Active DB connections exceed 80. Check for connection leaks."

      - alert: PostgresDiskUsageHigh
        expr: pg_database_size_bytes > 8e9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL database size > 8 GB"
          description: "Database {{ $labels.datname }} is {{ $value | humanize1024 }}B. Consider archiving old incidents."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter is unreachable — rate limiting and session cache are unavailable."

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage > 85%"
          description: "Redis is using {{ $value | humanizePercentage }} of its memory limit."

      - alert: RedisRejectedConnections
        expr: rate(redis_rejected_connections_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Redis is rejecting connections"
          description: "Redis has rejected {{ $value }} connections/s over the last 5 minutes."

  - name: nexusops.resources
    interval: 60s
    rules:
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total{job="nexusops"}[5m]) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NexusOps CPU usage > 80%"
          description: "Application CPU usage has been above 80% for 10 minutes."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes{job="nexusops"} > 1.5e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NexusOps memory > 1.5 GB"
          description: "Application is consuming {{ $value | humanize1024 }}B of RAM."

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Low disk space ({{ $value | humanizePercentage }} free)"
          description: "Root filesystem has less than 15% free space remaining."
